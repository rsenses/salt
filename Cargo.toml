[package]
name = "salt"
version = "0.1.0"
edition = "2024"
description = "A local terminal file manager with an editable directory buffer"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/rsenses/salt"
repository = "https://github.com/rsenses/salt"
publish = false

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
globset = "0.4"
mime_guess = "2"
shell-words = "1"
tempfile = "3"
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
